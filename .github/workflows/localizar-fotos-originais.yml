name: Localizar originais das fotos de referência

on:
  push:
    branches:
      - localizar-originais-pastor
    paths:
      - ".github/workflows/localizar-fotos-originais.yml"
      - "scripts/localizar_fotos_originais.py"
      - "scripts/reference_hashes.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: localizar-originais-pastor
  cancel-in-progress: true

jobs:
  procurar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Baixar as fotos originais e os arquivos RAW
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout: |
            /.github/workflows/localizar-fotos-originais.yml
            /scripts/localizar_fotos_originais.py
            /scripts/reference_hashes.json
            /colocar as fotos aqui/*.jpg
            /colocar as fotos aqui/*.jpeg
            /colocar as fotos aqui/*.CR2
            /fotosdopastor e a dona/*
          sparse-checkout-cone-mode: false
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar bibliotecas de comparação de imagem
        run: python -m pip install --upgrade pip Pillow numpy scipy rawpy
      - name: Comparar referências e copiar os originais encontrados
        run: python scripts/localizar_fotos_originais.py
      - name: Salvar a pasta no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -- "fotosdopastor e a dona"
          if git diff --cached --quiet; then
            echo "Nenhum arquivo novo para salvar."
          else
            git commit -m "Copy original photos matching supplied references"
            git push origin HEAD:localizar-originais-pastor
          fi
