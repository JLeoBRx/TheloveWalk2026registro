<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#211038"><title>Privacidade · The Love Walk 2026"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><style>:root{--bg:#211038;--deep:#170A2A;--o:#D96B35;--w:#F5F2F7;--m:#B8AFC4;--l:#493158}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--w);font:16px/1.75 'DM Sans',sans-serif}.wrap{width:min(800px,calc(100% - 36px));margin:auto;padding:52px 0 80px}.brand{color:var(--w);font:800 1rem Manrope;text-decoration:none}.mark{display:inline-grid;place-items:center;background:var(--o);color:var(--deep);width:35px;height:35px;border-radius:10px 10px 10px 3px;margin-right:10px}h1{font:800 clamp(2.5rem,8vw,4rem)/1 Manrope;letter-spacing:-.05em;margin:55px 0 20px}h2{font:700 1.25rem Manrope;margin-top:34px}p,li{color:var(--m)}a{color:var(--o)}.notice{border-left:3px solid var(--o);padding:8px 18px;background:#170a2a66}</style></head><body><main class="wrap"><a class="brand" href="/"><span class="mark">tlw</span>THE LOVE WALK 2026</a><h1>Aviso de <span style="color:var(--o)">privacidade.</span></h1><p class="notice"><strong>Importante:</strong> este texto é um modelo inicial e precisa ser completado e validado pelo responsável pelo evento e pelo encarregado/jurídico antes da publicação.</p><h2>Finalidade da busca facial</h2><p>A função “Encontre suas fotos” foi planejada para comparar uma imagem de referência com rostos detectados em fotografias autorizadas da caminhada, a fim de sugerir imagens em que a pessoa pode aparecer. Os resultados podem conter erros ou omissões e não representam uma confirmação de identidade.</p><h2>Imagem enviada para a busca</h2><p>O projeto foi estruturado para processar a imagem de referência temporariamente e não gravá-la em disco por padrão. A configuração real do servidor, registros operacionais, backups e eventuais serviços externos devem ser verificados antes de usar a função com participantes.</p><h2>Dados biométricos</h2><p>As representações faciais geradas a partir das fotografias são dados biométricos sensíveis. O responsável pelo tratamento deverá definir e documentar a base legal aplicável, a finalidade, a retenção, as medidas de segurança, os destinatários e o procedimento de exclusão, de acordo com a LGPD.</p><h2>Fotografias do evento</h2><p>Somente fotografias cuja publicação e processamento para a finalidade declarada tenham sido devidamente autorizados devem ser incluídas. A autorização para participar do evento ou aparecer em uma fotografia não deve ser presumida como autorização automática para reconhecimento facial.</p><h2>Direitos e contato</h2><p>Antes da publicação, preencha aqui o nome do controlador, o contato de privacidade/encarregado, o canal para solicitações dos titulares e o procedimento para solicitar correção, informação ou exclusão de dados.</p><h2>Segurança e retenção</h2><p>Em produção, o serviço deve usar HTTPS, acesso administrativo protegido, armazenamento restrito, política de retenção formalizada e processos testados para excluir embeddings e fotografias quando aplicável. Não publique o token administrativo ou o banco de dados.</p><p><a href="/">← Voltar ao site</a></p></main></body></html>
